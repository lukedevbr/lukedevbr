<svg xmlns="http://www.w3.org/2000/svg" width="420" height="144" viewBox="0 0 420 144" role="img" aria-label="Random Dev Quote">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141B45"/><stop offset="1" stop-color="#0A1128"/></linearGradient></defs>
<rect x="0.75" y="0.75" width="418.5" height="142.5" rx="10" fill="url(#bg)" stroke="#1B2A55" stroke-width="1.5"/>
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif"><text x="22" y="36" fill="#C9D1D9" font-size="15" font-style="italic">“Não existe código temporário.</text><text x="22" y="58" fill="#C9D1D9" font-size="15" font-style="italic">Existe código que ninguém teve</text><text x="22" y="80" fill="#C9D1D9" font-size="15" font-style="italic">coragem de apagar.”</text>
<text x="398" y="114" text-anchor="end" fill="#8B949E" font-size="13">— Folclore dev</text></g>
