<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="340" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D3F82"/>
      <stop offset="1" stop-color="#112652"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2147"/>
      <stop offset="1" stop-color="#081329"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- sombra na mesa -->
  <ellipse cx="170" cy="186" rx="160" ry="7" fill="#03070F" opacity=".55"/>

  <!-- tela -->
  <rect x="38" y="30" width="164" height="112" rx="8" fill="url(#shell)" stroke="#2E5BB8" stroke-width="2"/>
  <rect x="46" y="38" width="148" height="96" rx="4" fill="url(#scr)"/>
  <g stroke="#14306A" stroke-width="1" opacity=".7">
    <line x1="46" y1="62" x2="194" y2="62"/><line x1="46" y1="86" x2="194" y2="86"/><line x1="46" y1="110" x2="194" y2="110"/>
  </g>
  <!-- código </> -->
  <g filter="url(#glow)" fill="none" stroke="#4DA3FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="102,70 88,86 102,102"/>
    <line x1="128" y1="64" x2="112" y2="108"/>
    <polyline points="138,70 152,86 138,102"/>
  </g>

  <!-- dobradiça -->
  <rect x="30" y="142" width="180" height="5" rx="2" fill="#0E1F44" stroke="#2E5BB8" stroke-width="1"/>

  <!-- base: topo -->
  <polygon points="26,147 214,147 232,172 8,172" fill="url(#shell)" stroke="#2E5BB8" stroke-width="2" stroke-linejoin="round"/>
  <!-- teclado -->
  <polygon points="38,151 202,151 213,164 27,164" fill="#081329"/>
  <g stroke="#1F3F80" stroke-width="3" stroke-dasharray="9 3" stroke-linecap="round">
    <line x1="42" y1="154.5" x2="198" y2="154.5"/>
    <line x1="38" y1="158.5" x2="202" y2="158.5"/>
    <line x1="33" y1="162.5" x2="207" y2="162.5"/>
  </g>
  <!-- trackpad -->
  <polygon points="98,166 142,166 145,170 95,170" fill="#14306A" stroke="#2E5BB8" stroke-width="1"/>
  <!-- base: espessura frontal -->
  <path d="M8 172 H232 V176 Q232 180 226 180 H14 Q8 180 8 176 Z" fill="#0E1F44" stroke="#2E5BB8" stroke-width="1.5"/>
  <rect x="100" y="172" width="40" height="3" rx="1.5" fill="#081329"/>

  <!-- vaso com planta -->
  <g fill="#14306A" stroke="#2E5BB8" stroke-width="1.5" stroke-linejoin="round">
    <path d="M273 136 C255 120 252 98 262 82 C272 96 276 118 273 136Z"/>
    <path d="M273 136 C284 116 296 100 308 94 C310 114 296 130 273 136Z"/>
    <path d="M273 136 C268 112 272 92 278 70 C288 92 282 120 273 136Z"/>
  </g>
  <polygon points="258,142 292,142 288,180 262,180" fill="#10224A" stroke="#2E5BB8" stroke-width="2" stroke-linejoin="round"/>
  <rect x="254" y="135" width="42" height="9" rx="3" fill="#1D3F82" stroke="#2E5BB8" stroke-width="2"/>

  <!-- caneca -->
  <path d="M302 152 h28 v22 a8 8 0 0 1 -8 8 h-12 a8 8 0 0 1 -8 -8z" fill="#14306A" stroke="#2E5BB8" stroke-width="2"/>
  <ellipse cx="316" cy="152" rx="14" ry="4" fill="#081329" stroke="#2E5BB8" stroke-width="2"/>
  <path d="M330 158 q10 1 8 10 q-2 8 -8 6" fill="none" stroke="#2E5BB8" stroke-width="3.5" stroke-linecap="round"/>
</svg>
